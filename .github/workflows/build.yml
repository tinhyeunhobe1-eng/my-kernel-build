name: Build-KernelSU-SUSFS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone nguồn & thêm KSU-Next
        run: |
          git clone --branch android14-6.1 --depth=1 https://android.googlesource.com/kernel/common kernel-src
          cd kernel-src
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/main/kernel/setup.sh" | bash -s main
          
          # Tải SUSFS thủ công — đơn giản nhất
          cd KernelSU-Next
          git clone --depth=1 https://github.com/sidex15/susfs.git susfs
          echo "SUSFS đã tải xong!"

      - name: Cấu hình & Biên dịch
        run: |
          cd kernel-src
          make ARCH=arm64 CC=aarch64-linux-gnu-gcc CROSS_COMPILE=aarch64-linux-gnu- defconfig GKI_DEFCONFIG=gki_defconfig
          make ARCH=arm64 CC=aarch64-linux-gnu-gcc CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)

      - name: Upload kết quả
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image-android14-6.1
          path: kernel-src/arch/arm64/boot/
